name: CI y publicación

# Same lock as TSJ Filing: tests run on every push and pull request, and the
# site is published only from main and only when every test passed. Publishing
# stays off until the repository variable PAGES_ENABLED is "true" (set it once
# GitHub Pages and the domain are configured; see docs/SETUP.md).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Cheapest first: a formatting or type error is caught in seconds.
      - name: Formato
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      # Includes WCAG contrast for every token pair and the chart-palette
      # checks: a change that breaks accessibility never reaches production.
      - name: Pruebas unitarias
        run: npm test

      - name: Compilar
        run: npm run build

  publicar:
    name: Publicar en GitHub Pages
    needs: pruebas # ← the lock: no green tests, no deploy
    if: >-
      vars.PAGES_ENABLED == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    # Concurrency lives here, not at workflow level, so test runs on different
    # branches never queue behind each other.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el portal
        run: npm run build -w @empirica/web

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
