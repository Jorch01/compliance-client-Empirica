name: CI y publicación

# Same lock as TSJ Filing: tests run on every push and pull request, and the
# site and the backend are published only from main and only when every test
# passed. Each publication stays off until its repository variable is "true":
# PAGES_ENABLED for the site, API_DEPLOY_ENABLED for the backend (see
# docs/SETUP.md, steps 7 and 8).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Cheapest first: a formatting or type error is caught in seconds.
      - name: Formato
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      # Includes WCAG contrast for every token pair and the chart-palette
      # checks: a change that breaks accessibility never reaches production.
      - name: Pruebas unitarias
        run: npm test

      - name: Compilar
        run: npm run build

  publicar:
    name: Publicar en GitHub Pages
    needs: pruebas # ← the lock: no green tests, no deploy
    if: >-
      vars.PAGES_ENABLED == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    # Concurrency lives here, not at workflow level, so test runs on different
    # branches never queue behind each other.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el portal
        run: npm run build -w @empirica/web
        env:
          # Public by design (it ships to the browser), but kept out of the
          # repository so secret scanners do not flag it. docs/SETUP.md, step 8.
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5

  desplegar-api:
    name: Desplegar el backend (Apps Script)
    needs: pruebas # ← the same lock: no green tests, no deploy
    if: >-
      vars.API_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    concurrency:
      group: apps-script
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      # Values arrive through env, never pasted into the script: nothing in
      # them can be run as a command.
      SCRIPT_ID: ${{ vars.APPS_SCRIPT_ID }}
      DEPLOYMENT_ID: ${{ vars.APPS_SCRIPT_DEPLOYMENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el backend
        run: npm run build -w @empirica/api

      - name: Preparar clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "::error::Falta el secreto CLASPRC_JSON (docs/SETUP.md, paso 8)"; exit 1; fi
          if [ -z "$SCRIPT_ID" ]; then echo "::error::Falta la variable APPS_SCRIPT_ID (docs/SETUP.md, paso 8)"; exit 1; fi
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"build"}' "$SCRIPT_ID" > apps/api/.clasp.json

      - name: Subir el código
        working-directory: apps/api
        run: npx clasp push --force

      # Always the same deployment, so the Web App address never changes. The
      # first one is created by hand in the editor (docs/SETUP.md, step 9).
      - name: Publicar en la misma dirección
        working-directory: apps/api
        run: |
          if [ -n "$DEPLOYMENT_ID" ]; then
            npx clasp update-deployment "$DEPLOYMENT_ID" --description "${GITHUB_SHA::7}"
          else
            echo "::notice::Código subido. Falta la variable APPS_SCRIPT_DEPLOYMENT_ID para publicarlo (docs/SETUP.md, paso 9)."
          fi

      - name: Borrar la credencial
        if: always()
        run: rm -f "$HOME/.clasprc.json" apps/api/.clasp.json
