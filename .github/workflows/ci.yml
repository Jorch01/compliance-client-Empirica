name: CI y publicación

# Same lock as TSJ Filing: tests run on every push and pull request, and the
# site and the backend are published only from main and only when every test
# passed. Each publication stays off until its repository variable is "true":
# PAGES_ENABLED for the site, API_DEPLOY_ENABLED for the backend (see
# docs/SETUP.md, steps 7 and 8).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Cheapest first: a formatting or type error is caught in seconds.
      - name: Formato
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      # Includes WCAG contrast for every token pair and the chart-palette
      # checks: a change that breaks accessibility never reaches production.
      - name: Pruebas unitarias
        run: npm test

      - name: Compilar
        run: npm run build

      # What a first visit downloads before the sign-in, under its ceiling
      # (scripts/first-load.ts): each screen loads when it opens.
      - name: Peso de la primera carga
        run: npm run size

  # The portal in a real browser (Chromium) against the real backend code
  # with fictitious data: two devices converging after working offline,
  # nothing internal reaching a client, and WCAG 2.2 AA checked by axe.
  navegador:
    name: Pruebas en el navegador
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Pruebas en el navegador
        run: npm run test:e2e

  publicar:
    name: Publicar en GitHub Pages
    needs: [pruebas, navegador] # ← the lock: no green tests, no deploy
    if: >-
      vars.PAGES_ENABLED == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    # Concurrency lives here, not at workflow level, so test runs on different
    # branches never queue behind each other.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el portal
        run: npm run build -w @empirica/web
        env:
          # Public by design (it ships to the browser), but kept out of the
          # repository so secret scanners do not flag it. docs/SETUP.md, step 8.
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
          # The backend's address is built from it (src/config/api.ts).
          VITE_APPS_SCRIPT_DEPLOYMENT_ID: ${{ vars.APPS_SCRIPT_DEPLOYMENT_ID }}

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5

  desplegar-api:
    name: Desplegar el backend (Apps Script)
    needs: [pruebas, navegador] # ← the same lock: no green tests, no deploy
    if: >-
      vars.API_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    concurrency:
      group: apps-script
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      # Values arrive through env, never pasted into the script: nothing in
      # them can be run as a command. The project itself is named in
      # apps/api/.clasp.json.
      DEPLOYMENT_ID: ${{ vars.APPS_SCRIPT_DEPLOYMENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el backend
        run: npm run build -w @empirica/api

      - name: Preparar clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "::error::Falta el secreto CLASPRC_JSON (docs/SETUP.md, paso 8)"; exit 1; fi
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Subir el código
        working-directory: apps/api
        run: npx clasp push --force

      # Always the same deployment, so the Web App address never changes (the
      # first one is created by hand in the editor, docs/SETUP.md step 9). A
      # new version only when the backend changed: a project keeps at most 200
      # (docs/LIMITES.md). Then the Web App must answer its health check.
      - name: Publicar en la misma dirección
        working-directory: apps/api
        run: node deploy.ts

      - name: Borrar la credencial
        if: always()
        run: rm -f "$HOME/.clasprc.json"
